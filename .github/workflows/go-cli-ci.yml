name: Go CLI CI

on:
  push:
    branches: [vibing, master]
    paths:
      - 'tools/mineos-cli/**'
      - '.github/workflows/go-cli-ci.yml'
  pull_request:
    branches: [vibing, master]
    paths:
      - 'tools/mineos-cli/**'
      - '.github/workflows/go-cli-ci.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mineos-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/mineos-cli/go.mod
          cache-dependency-path: tools/mineos-cli/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

      # Goes beyond vet: the unused-code checks are what surfaced --remove-cli
      # being a fully implemented flag that no code path ever reached.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Test (race)
        run: go test ./... -race

      # Checks the module graph against the Go vulnerability database and, unlike
      # a plain dependency-age report, only fails on advisories whose vulnerable
      # symbols this code actually reaches.
      #
      # Most hits here are standard-library advisories, which are fixed by the
      # compiler rather than by a dependency: bump the `go` directive in
      # tools/mineos-cli/go.mod to the patch release the report names under
      # "Fixed in", since setup-go and the release workflow both read the
      # toolchain from that one line. The tool itself is pinned so a new
      # govulncheck release cannot change the verdict on its own — the advisory
      # database is fetched at run time and stays current regardless.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
