name: .NET CI

# The backend test suite used to run nowhere but on contributors' machines
# (AGENTS.md §2), so a change that broke it only surfaced after merge. This
# runs it on every PR.

on:
  push:
    branches: [vibing, master]
    paths:
      - 'apps/MineOS.*/**'
      - 'mineos-sveltkit.sln'
      - 'nuget.config'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [vibing, master]
    paths:
      - 'apps/MineOS.*/**'
      - 'mineos-sveltkit.sln'
      - 'nuget.config'
      - '.github/workflows/dotnet-ci.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore apps/MineOS.Tests/MineOS.Tests.csproj

      # `dotnet list --vulnerable` reports but always exits 0, so the marker
      # line has to be checked explicitly or an advisory scrolls past unnoticed
      # — which is how Microsoft.OpenApi 2.3.0 sat in the log for a while.
      - name: Audit packages
        run: |
          dotnet list apps/MineOS.Tests/MineOS.Tests.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see the table above)"
            exit 1
          fi

      - name: Build
        run: dotnet build apps/MineOS.Tests/MineOS.Tests.csproj --no-restore -c Release

      # Includes Architecture/LayerDependencyTests.cs, which fails if Domain or
      # Application gains a framework/outward dependency.
      - name: Test
        run: dotnet test apps/MineOS.Tests/MineOS.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
